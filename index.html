<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Alarma - Cyber Fitness</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { green: '#00ff88', cyan: '#00e5ff', dark: '#0d1117', card: '#161b22', border: '#30363d' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

    <div class="max-w-sm w-full bg-brand-card border border-brand-border rounded-2xl p-6 text-center space-y-4 shadow-2xl">
        <div class="text-brand-green text-4xl mb-2">
            <i class="fa-solid fa-bell-ring animate-bounce"></i>
        </div>
        <h1 class="text-xl font-extrabold text-brand-green tracking-wide">PRUEBA DE ALARMA</h1>
        <p class="text-xs text-gray-300 leading-relaxed">
            Pulsa el botón, concédele permiso y **bloquea la pantalla**. En <b>5 segundos</b> recibirás la alerta personalizada.
        </p>

        <button onclick="iniciarPrueba()" class="w-full bg-brand-green text-brand-dark font-extrabold py-3 rounded-xl text-sm transition hover:opacity-90 shadow-lg">
            ⚡ ACTIVAR Y PROBAR AHORA
        </button>

        <div id="cuenta-atras" class="text-xs font-mono text-brand-cyan hidden">
            Lanzando alarma en <span id="segundos">5</span> segundos...
        </div>
    </div>

    <script>
        function dispararAlarmaPrueba(titulo, mensaje) {
            if (Notification.permission === "granted") {
                new Notification(titulo, {
                    body: mensaje,
                    icon: "https://cdn-icons-png.flaticon.com/512/3603/3603850.png"
                });
            }

            if ("vibrate" in navigator) {
                navigator.vibrate([300, 100, 300, 100, 500]);
            }
        }

        function iniciarPrueba() {
            if (!("Notification" in window)) {
                alert("Tu navegador no soporta notificaciones.");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    const elemCuenta = document.getElementById('cuenta-atras');
                    const elemSeg = document.getElementById('segundos');
                    elemCuenta.classList.remove('hidden');

                    let seg = 5;
                    const intervalo = setInterval(() => {
                        seg--;
                        elemSeg.textContent = seg;
                        if (seg <= 0) {
                            clearInterval(intervalo);
                            elemCuenta.textContent = "🚀 ¡Notificación enviada!";
                            
                            // TÍTULO Y TEXTO PERSONALIZADO DE LA ALARMA DE PRUEBA
                            dispararAlarmaPrueba(
                                "🏋️ Gym Prep (15:30)", 
                                "¡Es hora de preparar la bolsa e ir al gimnasio!"
                            );
                        }
                    }, 1000);
                } else {
                    alert("Necesitas aceptar los permisos para recibir la alerta.");
                }
            });
        }
    </script>
</body>
</html>
